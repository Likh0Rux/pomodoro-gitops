<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro — Focus Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d12;
    --bg-glow: rgba(255, 122, 69, 0.10);
    --surface: #12151c;
    --surface-2: #171b24;
    --border: rgba(255,255,255,0.08);
    --border-soft: rgba(255,255,255,0.05);
    --text: #f1f3f6;
    --text-muted: #868fa3;
    --text-faint: #4b5165;

    --ember-1: #ff8a4c;
    --ember-2: #ff4d6d;
    --cool-1: #38e8c6;
    --cool-2: #4fa8ff;

    --accent-1: var(--ember-1);
    --accent-2: var(--ember-2);
    --accent-glow: rgba(255, 122, 69, 0.35);

    --radius-lg: 20px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    background:
      radial-gradient(600px 400px at 50% 20%, var(--bg-glow), transparent 70%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    transition: background 0.6s ease;
  }

  body[data-mode="short"], body[data-mode="long"] {
    --accent-1: var(--cool-1);
    --accent-2: var(--cool-2);
    --accent-glow: rgba(56, 232, 198, 0.30);
  }

  .app {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2.5rem;
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .wordmark .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    transition: background 0.6s ease;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .settings-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s, transform 0.2s;
  }
  .settings-btn:hover { color: var(--text); border-color: var(--border); transform: rotate(35deg); }
  .settings-btn:focus-visible { outline: 2px solid var(--accent-1); outline-offset: 2px; }
  .settings-btn svg { width: 18px; height: 18px; }

  /* ---------- Header ---------- */
  header {
    text-align: center;
    margin-bottom: 2rem;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(1.5rem, 5vw, 1.9rem);
    letter-spacing: -0.02em;
    margin-bottom: 0.4rem;
  }

  header p {
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  /* ---------- Mode tabs ---------- */
  .tabs {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 2.5rem;
    gap: 4px;
  }

  .tab {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.25s, color 0.25s;
    white-space: nowrap;
  }

  .tab:focus-visible { outline: 2px solid var(--accent-1); outline-offset: 2px; }

  .tab[aria-selected="true"] {
    background: var(--surface-2);
    color: var(--text);
  }

  /* ---------- Ring ---------- */
  .ring-wrap {
    position: relative;
    width: min(74vw, 280px);
    height: min(74vw, 280px);
    margin-bottom: 2.2rem;
  }

  .ring-glow {
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-glow), transparent 70%);
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .ring-wrap[data-running="true"] .ring-glow {
    opacity: 1;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.55; }
    50% { transform: scale(1.06); opacity: 0.9; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ring-wrap[data-running="true"] .ring-glow { animation: none; opacity: 0.7; }
  }

  svg.ring { width: 100%; height: 100%; transform: rotate(-90deg); }

  .ring-track {
    fill: none;
    stroke: var(--surface-2);
    stroke-width: 10;
  }

  .ring-progress {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
    stroke: url(#ringGradient);
    transition: stroke-dashoffset 1s linear;
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .time {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 12vw, 3.4rem);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .session-label {
    margin-top: 0.6rem;
    font-size: 0.78rem;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  .dots {
    display: flex;
    gap: 6px;
    margin-top: 0.7rem;
  }

  .dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-faint);
    transition: background 0.3s, transform 0.3s;
  }

  .dots span.done {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  }

  .dots span.active {
    transform: scale(1.4);
    background: var(--text);
  }

  /* ---------- Controls ---------- */
  .controls {
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }

  button.ctrl {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    border-radius: 999px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 0.75rem 1.3rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: transform 0.15s ease, border-color 0.2s, background 0.2s;
  }

  button.ctrl:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.18); }
  button.ctrl:active { transform: translateY(0); }
  button.ctrl:focus-visible { outline: 2px solid var(--accent-1); outline-offset: 2px; }

  button.ctrl svg { width: 15px; height: 15px; }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    border: none;
    color: #14100c;
    padding: 0.85rem 1.8rem;
    box-shadow: 0 8px 24px -8px var(--accent-glow);
  }

  .btn-primary:hover { transform: translateY(-1px) scale(1.015); }

  /* ---------- Settings panel ---------- */
  .settings-panel {
    width: 100%;
    max-width: 420px;
    margin-top: 1.6rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.2rem 1.3rem;
    display: none;
    flex-direction: column;
    gap: 0.9rem;
  }

  .settings-panel.open { display: flex; }

  .settings-panel h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 0.2rem;
  }

  .field-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .field-row label {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .stepper {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 0.3rem 0.4rem;
  }

  .stepper button {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .stepper button:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .stepper button:focus-visible { outline: 2px solid var(--accent-1); outline-offset: 1px; }

  .stepper output {
    font-family: 'Space Grotesk', sans-serif;
    font-variant-numeric: tabular-nums;
    min-width: 2.2ch;
    text-align: center;
    font-size: 0.9rem;
  }

  footer {
    margin-top: 2.2rem;
    font-size: 0.75rem;
    color: var(--text-faint);
    text-align: center;
  }

  kbd {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: 4px;
    padding: 0.05rem 0.35rem;
    font-size: 0.7rem;
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }
</style>
</head>
<body data-mode="focus">

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop id="gradStop1" offset="0%" stop-color="#ff8a4c" />
      <stop id="gradStop2" offset="100%" stop-color="#ff4d6d" />
    </linearGradient>
  </defs>
</svg>

<div class="app">

  <div class="topbar">
    <div class="wordmark"><span class="dot" aria-hidden="true"></span>pomodoro</div>
    <button class="settings-btn" id="settingsToggle" aria-expanded="false" aria-controls="settingsPanel" aria-label="Impostazioni durata">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>

  <header>
    <h1>Focus Timer</h1>
    <p>Un compito. Un timer. Nessuna distrazione.</p>
  </header>

  <div class="tabs" role="tablist" aria-label="Modalità">
    <button class="tab" role="tab" id="tabFocus" aria-selected="true" data-mode="focus">Focus</button>
    <button class="tab" role="tab" id="tabShort" aria-selected="false" data-mode="short">Pausa breve</button>
    <button class="tab" role="tab" id="tabLong" aria-selected="false" data-mode="long">Pausa lunga</button>
  </div>

  <div class="ring-wrap" id="ringWrap" data-running="false">
    <div class="ring-glow" aria-hidden="true"></div>
    <svg class="ring" viewBox="0 0 240 240" aria-hidden="true">
      <circle class="ring-track" cx="120" cy="120" r="104"></circle>
      <circle class="ring-progress" id="ringProgress" cx="120" cy="120" r="104"
        stroke-dasharray="653.45" stroke-dashoffset="0"></circle>
    </svg>
    <div class="ring-center">
      <div class="time" id="timeDisplay" aria-live="polite">25:00</div>
      <div class="session-label" id="sessionLabel">Sessione 1 di 4</div>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl" id="resetBtn" aria-label="Azzera timer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 4v6h6"></path><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
      </svg>
      Reset
    </button>

    <button class="ctrl btn-primary" id="startBtn">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none">
        <rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect>
      </svg>
      <span id="startLabel">Avvia</span>
    </button>

    <button class="ctrl" id="skipBtn" aria-label="Salta alla fase successiva">
      Skip
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 4l10 8-10 8V4z"></path><path d="M19 5v14"></path>
      </svg>
    </button>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <h2>Durate (minuti)</h2>

    <div class="field-row">
      <label for="focusVal">Focus</label>
      <div class="stepper">
        <button type="button" data-setting="focus" data-delta="-1" aria-label="Diminuisci focus">−</button>
        <output id="focusVal">25</output>
        <button type="button" data-setting="focus" data-delta="1" aria-label="Aumenta focus">+</button>
      </div>
    </div>

    <div class="field-row">
      <label for="shortVal">Pausa breve</label>
      <div class="stepper">
        <button type="button" data-setting="short" data-delta="-1" aria-label="Diminuisci pausa breve">−</button>
        <output id="shortVal">5</output>
        <button type="button" data-setting="short" data-delta="1" aria-label="Aumenta pausa breve">+</button>
      </div>
    </div>

    <div class="field-row">
      <label for="longVal">Pausa lunga</label>
      <div class="stepper">
        <button type="button" data-setting="long" data-delta="-1" aria-label="Diminuisci pausa lunga">−</button>
        <output id="longVal">15</output>
        <button type="button" data-setting="long" data-delta="1" aria-label="Aumenta pausa lunga">+</button>
      </div>
    </div>
  </div>

  <footer>
    <kbd>Spazio</kbd> avvia/pausa &nbsp;·&nbsp; <kbd>R</kbd> reset &nbsp;·&nbsp; <kbd>S</kbd> skip
  </footer>

</div>

<script>
(function () {
  "use strict";

  const CIRC = 653.45; // 2 * PI * 104
  const SESSIONS_BEFORE_LONG = 4;

  const settings = { focus: 25, short: 5, long: 15 };

  const state = {
    mode: 'focus',        // 'focus' | 'short' | 'long'
    remaining: settings.focus * 60,
    running: false,
    session: 1,
    intervalId: null
  };

  const el = {
    time: document.getElementById('timeDisplay'),
    sessionLabel: document.getElementById('sessionLabel'),
    dots: document.getElementById('dots'),
    ring: document.getElementById('ringProgress'),
    ringWrap: document.getElementById('ringWrap'),
    startBtn: document.getElementById('startBtn'),
    startLabel: document.getElementById('startLabel'),
    playIcon: document.getElementById('playIcon'),
    pauseIcon: document.getElementById('pauseIcon'),
    resetBtn: document.getElementById('resetBtn'),
    skipBtn: document.getElementById('skipBtn'),
    tabs: {
      focus: document.getElementById('tabFocus'),
      short: document.getElementById('tabShort'),
      long: document.getElementById('tabLong')
    },
    body: document.body,
    settingsToggle: document.getElementById('settingsToggle'),
    settingsPanel: document.getElementById('settingsPanel'),
    gradStop1: document.getElementById('gradStop1'),
    gradStop2: document.getElementById('gradStop2')
  };

  const modeLabels = { focus: 'Focus', short: 'Pausa breve', long: 'Pausa lunga' };

  function totalSeconds(mode) {
    return settings[mode] * 60;
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return m + ':' + s;
  }

  function renderDots() {
    el.dots.innerHTML = '';
    for (let i = 1; i <= SESSIONS_BEFORE_LONG; i++) {
      const d = document.createElement('span');
      if (i < state.session) d.classList.add('done');
      if (i === state.session && state.mode === 'focus') d.classList.add('active');
      el.dots.appendChild(d);
    }
  }

  function updateRingColors() {
    if (state.mode === 'focus') {
      el.gradStop1.setAttribute('stop-color', '#ff8a4c');
      el.gradStop2.setAttribute('stop-color', '#ff4d6d');
    } else {
      el.gradStop1.setAttribute('stop-color', '#38e8c6');
      el.gradStop2.setAttribute('stop-color', '#4fa8ff');
    }
  }

  function render() {
    el.time.textContent = formatTime(state.remaining);
    const total = totalSeconds(state.mode);
    const progressFrac = 1 - (state.remaining / total);
    el.ring.setAttribute('stroke-dashoffset', String(CIRC * (1 - progressFrac)));

    el.sessionLabel.textContent = state.mode === 'focus'
      ? 'Sessione ' + state.session + ' di ' + SESSIONS_BEFORE_LONG
      : modeLabels[state.mode];

    renderDots();

    Object.keys(el.tabs).forEach(function (m) {
      el.tabs[m].setAttribute('aria-selected', m === state.mode ? 'true' : 'false');
    });

    el.body.setAttribute('data-mode', state.mode);
    el.ringWrap.setAttribute('data-running', state.running ? 'true' : 'false');
    updateRingColors();

    el.playIcon.style.display = state.running ? 'none' : 'block';
    el.pauseIcon.style.display = state.running ? 'block' : 'none';
    el.startLabel.textContent = state.running ? 'Pausa' : (state.remaining === total ? 'Avvia' : 'Riprendi');

    document.title = state.running
      ? formatTime(state.remaining) + ' · ' + modeLabels[state.mode]
      : 'Pomodoro — Focus Timer';
  }

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = state.mode === 'focus' ? 720 : 520;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
      o.connect(g); g.connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + 0.55);
      o.onended = function () { ctx.close(); };
    } catch (e) { /* audio non disponibile, ignora silenziosamente */ }
  }

  function notify() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') {
      try {
        new Notification('Pomodoro', {
          body: state.mode === 'focus' ? 'Tempo di pausa.' : 'Si torna al lavoro.'
        });
      } catch (e) { /* noop */ }
    }
  }

  function switchMode(newMode, resetSession) {
    stopInterval();
    state.mode = newMode;
    state.remaining = totalSeconds(newMode);
    state.running = false;
    if (resetSession) state.session = 1;
    render();
  }

  function advancePhase() {
    beep();
    notify();
    if (state.mode === 'focus') {
      if (state.session >= SESSIONS_BEFORE_LONG) {
        switchMode('long', false);
      } else {
        switchMode('short', false);
      }
    } else {
      if (state.mode === 'long') {
        state.session = 1;
      } else {
        state.session += 1;
      }
      switchMode('focus', false);
    }
  }

  function tick() {
    state.remaining -= 1;
    if (state.remaining <= 0) {
      advancePhase();
      return;
    }
    render();
  }

  function stopInterval() {
    if (state.intervalId) {
      clearInterval(state.intervalId);
      state.intervalId = null;
    }
  }

  function toggleRun() {
    if (state.running) {
      state.running = false;
      stopInterval();
    } else {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().catch(function () {});
      }
      state.running = true;
      state.intervalId = setInterval(tick, 1000);
    }
    render();
  }

  function resetTimer() {
    state.running = false;
    stopInterval();
    state.remaining = totalSeconds(state.mode);
    render();
  }

  function skipPhase() {
    stopInterval();
    advancePhase();
  }

  el.startBtn.addEventListener('click', toggleRun);
  el.resetBtn.addEventListener('click', resetTimer);
  el.skipBtn.addEventListener('click', skipPhase);

  Object.keys(el.tabs).forEach(function (m) {
    el.tabs[m].addEventListener('click', function () {
      switchMode(m, m === 'focus');
    });
  });

  el.settingsToggle.addEventListener('click', function () {
    const open = el.settingsPanel.classList.toggle('open');
    el.settingsToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  document.querySelectorAll('.stepper button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const key = btn.getAttribute('data-setting');
      const delta = parseInt(btn.getAttribute('data-delta'), 10);
      const min = key === 'focus' ? 5 : 1;
      const max = key === 'focus' ? 90 : 45;
      settings[key] = Math.min(max, Math.max(min, settings[key] + delta));
      document.getElementById(key + 'Val').textContent = settings[key];
      if (state.mode === key && !state.running) {
        state.remaining = totalSeconds(state.mode);
        render();
      }
    });
  });

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'BUTTON' && e.key === ' ') { /* avoid double trigger on focused button */ }
    if (e.code === 'Space') { e.preventDefault(); toggleRun(); }
    else if (e.key === 'r' || e.key === 'R') { resetTimer(); }
    else if (e.key === 's' || e.key === 'S') { skipPhase(); }
  });

  render();
})();
</script>

</body>
</html>
